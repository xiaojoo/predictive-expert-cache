[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-expert-cache"
version = "0.1.0"
description = "Predictive Expert Cache for Mixture-of-Experts models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

qwen = [
    "transformers>=4.52.3",
]

[tool.setuptools.packages.find]
include = [
    "predictive_cache",
    "predictive_cache.*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]